# End-to-end validation only. The local data generator creates fictional prices.
qlib_init:
    provider_uri: ".data/cn_demo"
    region: cn
    exp_manager:
        class: MLflowExpManager
        module_path: qlib.workflow.expm
        kwargs:
            uri: "sqlite:///./.data/qlib_mlruns_mlflow3_12.db"
            default_exp_name: workflow
market: &market csi500
benchmark: &benchmark SH000905
data_handler_config: &data_handler_config
    start_time: 2019-10-01
    end_time: 2021-12-31
    fit_start_time: 2020-01-01
    fit_end_time: 2020-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 8
            n_drop: 2
    backtest:
        start_time: 2021-07-01
        end_time: 2021-12-31
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            # Commission 0.02% both ways; assumed transfer fee 0.001% both
            # ways and current stamp duty 0.05% on sells. Qlib applies the
            # minimum to the combined amount, an approximation for small orders.
            open_cost: 0.00021
            close_cost: 0.00071
            min_cost: 5
            trade_unit: 100
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            num_leaves: 20
            num_threads: 4
            num_boost_round: 100
            early_stopping_rounds: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-01-01, 2020-12-31]
                valid: [2021-01-01, 2021-06-30]
                test: [2021-07-01, 2021-12-31]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: False
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
