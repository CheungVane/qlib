[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-workbench"
version = "0.1.0"
description = "Engine-neutral research result workbench for Qlib and other engines"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qlib-import = ["mlflow>=3.12,<3.13", "pandas>=2.1"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
analysis = ["numpy>=1.26"]
data-fetch = ["baostock>=0.9.4,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
qwb = "quant_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_workbench*"]

[tool.setuptools.package-data]
"quant_workbench.ui" = ["*.html", "*.css", "*.js", "*.json"]
